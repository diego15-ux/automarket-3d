# Servicios locales para desarrollo: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: automarket
      MYSQL_USER: automarket
      MYSQL_PASSWORD: automarket
      MYSQL_ROOT_PASSWORD: automarket-root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uautomarket", "-pautomarket"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Bandeja SMTP de desarrollo: los correos se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysqldata:
